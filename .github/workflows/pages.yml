name: Build and publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset:
        description: Which inputs to build from
        type: choice
        options: [release, demo]
        default: release

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs replace each other rather than racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Check the environment
        run: |
          uv sync
          uv run ruff check src tests scripts
          uv run pytest -q

      # The data is built where the inputs are, not here: an aiqclib batch
      # is 2.2 GB that the build reads twice, and this workflow runs on every
      # push to main, so a commit touching a docstring would re-derive files
      # identical to the ones already published. The variable holds the tag to
      # deploy, which makes a data refresh a variable change and a re-run.
      - name: Fetch the published data
        if: vars.NRTQC_DATA_RELEASE != '' && inputs.dataset != 'demo'
        env:
          # A public data repository needs no secret; a private one needs a
          # token with read access to it, since the job's own token is scoped
          # to this repository alone.
          GH_TOKEN: ${{ secrets.NRTQC_DATA_TOKEN || github.token }}
          DATA_REPO: ${{ vars.NRTQC_DATA_REPO || 'AIQC-Hub/nrtqc-diff-data' }}
          DATA_RELEASE: ${{ vars.NRTQC_DATA_RELEASE }}
        run: |
          uv run python scripts/data_release.py \
            --repo "$DATA_REPO" fetch "$DATA_RELEASE"

      # Without that variable the synthetic demo is generated and built here,
      # which is what keeps a fork, a clean checkout and a `demo` dispatch
      # deployable with no access to anything. It is seconds, not minutes.
      - name: Build the demo data
        if: vars.NRTQC_DATA_RELEASE == '' || inputs.dataset == 'demo'
        run: |
          uv run python scripts/make_demo_data.py
          uv run nrtqc-diff build -c config/datasets.yaml

      - name: Vendor the browser libraries
        run: bash scripts/fetch_assets.sh

      - name: Render
        run: quarto render site

      # The data is served from this site rather than from the release it was
      # built from: release assets carry no CORS header, so a browser cannot
      # read them. See docs/RELEASING.md.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
