# Build configuration for the nrtqclib `test_nrt` batch.
#
# This is the real thing, as opposed to `datasets.yaml`, which points at the
# synthetic demo so that a clean checkout and the CI workflow keep working.
# `source` names the file stem the ctddump and seastamp reports use for each
# dataset; only `nrtqc-diff analyse` reads it.
# Paths are resolved relative to this file and go through the `data` symlink,
# which is not in git; see CLAUDE.md.
#
#   uv run nrtqc-diff build -c config/test_nrt.yaml
#
# Expect about three minutes and roughly 430 MB of output. The inputs hold
# 330 million observations, of which the trimming rule publishes about 83
# million, in 343,000 profiles.

site:
  title: NRT QC flag differences
  data_dir: ../site/data
  # The site reads the observation files over HTTP range requests, so this is
  # the unit a profile lookup pays for. See DEFAULT_ROW_GROUP_SIZE in
  # src/nrtqc_diff/config.py for why the middle of the range is cheapest.
  row_group_size: 100000

# `bad_flag_values` covers the values the source calls an anomaly: 3 is
# probably bad, 4 is bad, 6 and 7 are the dataset-specific bad values. The
# `nrt_qc_config.yaml` of the nrtqclib run counted only [4, 6, 7]; 3 is
# included here because a value the source doubts is worth showing.
#
# `missing_flag_values` covers the values that carry no judgement at all: 0 is
# "no QC performed" and 9 is "missing value". They are reported as "no input
# flag" rather than being counted as the two sources agreeing. The inputs use
# the rest of the scheme too: 2 (probably good), 5 (value changed) and 8
# (interpolated) all mean the observation is usable, so they count as good.
variables:
  - name: temp
    label: Temperature
    unit: degC
    flag: temp_qc
    nrt_flag: temp_nrt_flag
    bad_flag_values: [3, 4, 6, 7]
    missing_flag_values: [0, 9]
  - name: psal
    label: Salinity
    unit: PSU
    flag: psal_qc
    nrt_flag: psal_nrt_flag
    bad_flag_values: [3, 4, 6, 7]
    missing_flag_values: [0, 9]

# Where the observation-level data mode lives: `R` (real time), `A` (adjusted
# in real time) or `D` (delayed mode), as ctddump writes it and nrtqclib
# passes it through. A profile with a delayed value in any of these columns
# is published as "delayed mode" rather than "NRT only", because its
# input flags are likely to be an operator's decisions. One with no delayed
# value but an empty one, which ctddump writes when the file gives no usable
# mode, is published as "data mode unknown": NRT only takes positive
# evidence. An empty mode counts only where its parameter (`temp` for
# `temp_dm`) has a value, since ctddump leaves it empty at a missing level.
# Pressure is listed too: a profile whose pressure was revised in delayed
# mode was touched by one. `delayed_values` defaults to [D].
#
# A dataset entry can set `data_mode` to file all of its profiles under one
# group regardless, for a product whose flags come from its own delayed mode
# QC.
data_mode:
  columns: [temp_dm, psal_dm, pres_dm]
  delayed_values: [D]
  # A profile marked NRT (or with no data mode) whose flags of temperature or
  # salinity look like an operator's is filed as delayed mode too: at least
  # min_share of that variable's observations with a usable input flag are
  # flagged by the input and not by nrtqclib, counting only a variable with
  # min_observations such values. A profile on land (analyses.land below) is
  # not estimated. `estimated: false` turns it off. The analyses apply the
  # same rule per variable.
  estimated:
    min_share: 0.6
    min_observations: 10
    groups: [nrt, unknown]

# What `nrtqc-diff analyse` reads besides the datasets, and where it writes.
# The tables go under site/data so that a data release carries them, and the
# R scripts under analysis/ draw the figures beside them. The report folders
# sit next to the nrtqclib batch, which is reached through the `data` link:
# these paths follow the link before applying `..`. See docs/ANALYSES.md.
analyses:
  out_dir: ../site/data/analyses
  ctddump_reports: ../data/../ctddump/report
  ctddump_headers: ../data/../ctddump/header
  ctddump_dups: ../data/../ctddump/dups
  seastamp_reports: ../data/../seastamp/report/stamp
  # seastamp's bathymetry is GEBCO elevation, negative under water. A
  # position at or above sea level is on land, as nrtqclib's RTQC4 has it.
  land:
    column: bathymetry
    positive_depth: false
    margins_m: [0, 5, 10, 20, 50, 100]
  # The estimated delayed mode rule is data_mode.estimated above. The
  # analyses apply it per variable, and take a profile out of only the
  # comparison of the variable it was estimated for; the sensitivity table
  # tries these thresholds.
  estimated_delayed:
    sensitivity: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]

# The eight datasets of the batch are a region by product grid. `ar`, `bo` and
# `mo` are the Copernicus codes for the Arctic, the Baltic and the
# Mediterranean; `gl` is the global product covering the same region, and
# `cora` is the reprocessed one. The Baltic has no global entry, which the
# tree handles: products are derived from what was built.
datasets:
  - id: ar_ar
    region: Arctic Ocean
    product: NRT regional
    label: Arctic NRT
    description: Near real time product for the Arctic region.
    path: ../data/nrt_qc_ar_ar_0001/nrt_qc/nrt_qc_output.parquet
    source: nrt_ar_ar

  - id: ar_gl
    region: Arctic Ocean
    product: NRT global
    label: Arctic from the global NRT product
    description: The global near real time product, Arctic subset.
    path: ../data/nrt_qc_ar_gl_0001/nrt_qc/nrt_qc_output.parquet
    source: nrt_ar_gl

  - id: cora_ar
    region: Arctic Ocean
    product: CORA
    label: Arctic CORA
    description: The reprocessed CORA product for the Arctic region.
    path: ../data/nrt_qc_cora_ar_0001/nrt_qc/nrt_qc_output.parquet
    source: cora_ar
    # CORA's DATA_MODE describes the original observation, not the
    # reprocessing QC that set CORA's flags, so every CORA profile carries
    # delayed mode flags whatever its data mode columns say.
    data_mode: delayed

  - id: bo_bo
    region: Baltic Sea
    product: NRT regional
    label: Baltic NRT
    description: Near real time product for the Baltic region.
    path: ../data/nrt_qc_bo_bo_0001/nrt_qc/nrt_qc_output.parquet
    source: nrt_bo_bo

  - id: cora_bo
    region: Baltic Sea
    product: CORA
    label: Baltic CORA
    description: The reprocessed CORA product for the Baltic region.
    path: ../data/nrt_qc_cora_bo_0001/nrt_qc/nrt_qc_output.parquet
    source: cora_bo
    # CORA's DATA_MODE describes the original observation, not the
    # reprocessing QC that set CORA's flags, so every CORA profile carries
    # delayed mode flags whatever its data mode columns say.
    data_mode: delayed

  - id: mo_mo
    region: Mediterranean Sea
    product: NRT regional
    label: Mediterranean NRT
    description: Near real time product for the Mediterranean region.
    path: ../data/nrt_qc_mo_mo_0001/nrt_qc/nrt_qc_output.parquet
    source: nrt_mo_mo

  - id: mo_gl
    region: Mediterranean Sea
    product: NRT global
    label: Mediterranean from the global NRT product
    description: The global near real time product, Mediterranean subset.
    path: ../data/nrt_qc_mo_gl_0001/nrt_qc/nrt_qc_output.parquet
    source: nrt_mo_gl

  - id: cora_mo
    region: Mediterranean Sea
    product: CORA
    label: Mediterranean CORA
    description: The reprocessed CORA product for the Mediterranean region.
    path: ../data/nrt_qc_cora_mo_0001/nrt_qc/nrt_qc_output.parquet
    source: cora_mo
    # CORA's DATA_MODE describes the original observation, not the
    # reprocessing QC that set CORA's flags, so every CORA profile carries
    # delayed mode flags whatever its data mode columns say.
    data_mode: delayed
